<!DOCTYPE html>
<html lang="am" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ይቻላል የመጽሐፍት መደብር</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Inter & Ethiopic support -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col justify-between">

    <!-- ፕሪሚየም ራስጌ (Header) -->
    <header class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="bg-indigo-600 text-white p-2 rounded-xl font-bold text-lg shadow-md shadow-indigo-100">ይ</span>
                <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">ይቻላል መደብር</h1>
            </div>
            <div class="flex items-center space-x-4">
                <button onclick="toggleCart()" class="relative flex items-center space-x-2 bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl transition font-medium text-sm">
                    <span>🛒 ቅርጫት</span>
                    <span id="cart-count" class="bg-indigo-600 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- ዋናው ማሳያ (Main Content) -->
    <main class="max-w-7xl mx-auto px-6 py-10 flex-grow w-full flex flex-col lg:flex-row gap-10">
        
        <!-- የመጽሐፍት ግሪድ ክፍል -->
        <div class="w-full lg:w-3/4">
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h2 class="text-2xl font-bold text-slate-900">የተመረጡ መጽሐፍት</h2>
                    <p class="text-slate-500 text-sm mt-1">የዕውቀት ማዕድ የሆነውን መጽሐፍ ይምረጡ</p>
                </div>
            </div>
            <div id="books-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
                <div class="col-span-full py-12 text-center text-slate-400">መጽሐፍት በመጫን ላይ ናቸው...</div>
            </div>
        </div>

        <!-- የግዢ ቅርጫት ጎን ሰሌዳ (Cart Sidebar) -->
        <div id="cart-sidebar" class="w-full lg:w-1/4 bg-white p-6 rounded-2xl shadow-xl shadow-slate-100 border border-slate-100 h-fit sticky top-24">
            <h3 class="text-lg font-bold mb-4 text-slate-900 border-b pb-3">የግዢ ቅርጫትዎ</h3>
            <div id="cart-items" class="space-y-4 mb-6 max-h-72 overflow-y-auto pr-1">
                <p class="text-slate-400 text-sm py-4 text-center">ቅርጫቱ ባዶ ነው።</p>
            </div>
            <div class="border-t border-slate-100 pt-4">
                <div class="flex justify-between font-bold text-slate-900 mb-6">
                    <span>አጠቃላይ ድምር፡</span>
                    <span id="cart-total" class="text-indigo-600">0.00 ብር</span>
                </div>
                <button onclick="checkout()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white py-3 rounded-xl transition shadow-lg shadow-emerald-100 font-semibold text-sm">ክፍያ በደህና ይፈጽሙ</button>
            </div>
        </div>

    </main>

    <!-- እግርጌ (Footer) -->
    <footer class="bg-white border-t border-slate-100 py-6 mt-12 text-center text-slate-400 text-xs">
        <p>© 2026 ይቻላል መጽሐፍት መደብር። መብቱ በህግ የተጠበቀ ነው።</p>
    </footer>

    <script>
        // የSupabase ማገናኛ
        const SUPABASE_URL = 'https://dmjpbujthqprvpszgcrs.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtanBidWp0aHFwcnZwc3pnY3JzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMTA5ODgsImV4cCI6MjEwODU4Njk4OH0.1pciufqyTB71Q6qlYus3crxbs8pOqDYwWIyk72Kkico';
        
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let booksList = [];
        let cart = [];

        function toggleCart() {
            const sidebar = document.getElementById('cart-sidebar');
            sidebar.classList.toggle('hidden');
        }

        async function fetchBooks() {
            const grid = document.getElementById('books-grid');
            try {
                const { data: books, error } = await client.from('books').select('*');
                
                if (error) {
                    grid.innerHTML = `<p class="text-rose-500 font-medium">የዳታቤዝ ስህተት: ${error.message}</p>`;
                    return;
                }

                if (!books || books.length === 0) {
                    grid.innerHTML = '<p class="text-slate-400">ምንም መጽሐፍ አልተገኘም።</p>';
                    return;
                }

                booksList = books;
                grid.innerHTML = books.map(book => `
                    <div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col justify-between group">
                        <div>
                            <div class="overflow-hidden rounded-xl mb-4 bg-slate-100 h-52">
                                <img src="${book.cover_image_url || 'https://via.placeholder.com/150'}" alt="${book.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                            </div>
                            <h3 class="font-bold text-base text-slate-900 mb-1 line-clamp-1">${book.title}</h3>
                            <p class="text-xs text-slate-500 mb-3">ደራሲ፡ ${book.author}</p>
                            <p class="text-indigo-600 font-bold text-sm mb-4">${book.price} ብር</p>
                        </div>
                        <button onclick="addToCart('${book.id}')" class="w-full bg-slate-900 hover:bg-indigo-600 text-white py-2.5 rounded-xl transition font-medium text-xs shadow-sm">ወደ ቅርጫት ጨምር</button>
                    </div>
                `).join('');
            } catch (err) {
                grid.innerHTML = `<p class="text-rose-500 font-medium">የኮድ ስህተት ተፈጥሯል: ${err.message}</p>`;
            }
        }

        function addToCart(bookId) {
            const book = booksList.find(b => b.id === bookId);
            if (!book) return;

            const existingItem = cart.find(item => item.id === bookId);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...book, quantity: 1 });
            }

            updateCartUI();
        }

        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cart-items');
            const cartCount = document.getElementById('cart-count');
            const cartTotal = document.getElementById('cart-total');

            cartCount.textContent = cart.reduce((sum, item) => sum + item.quantity, 0);

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p class="text-slate-400 text-xs py-4 text-center">ቅርጫቱ ባዶ ነው።</p>';
                cartTotal.textContent = '0.00 ብር';
                return;
            }

            let total = 0;
            cartItemsContainer.innerHTML = cart.map(item => {
                total += item.price * item.quantity;
                return `
                    <div class="flex justify-between items-center text-xs border-b border-slate-50 pb-3">
                        <div class="pr-2">
                            <p class="font-bold text-slate-800 line-clamp-1">${item.title}</p>
                            <p class="text-slate-400 mt-0.5">${item.price} ብር × ${item.quantity}</p>
                        </div>
                        <button onclick="removeFromCart('${item.id}')" class="text-rose-400 hover:text-rose-600 font-bold p-1">✕</button>
                    </div>
                `;
            }).join('');

            cartTotal.textContent = total.toFixed(2) + ' ብር';
        }

        function removeFromCart(bookId) {
            cart = cart.filter(item => item.id !== bookId);
            updateCartUI();
        }

        async function checkout() {
            if (cart.length === 0) {
                alert('እባክዎ መጀመሪያ መጽሐፍ ይምረጡ!');
                return;
            }

            const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const email = prompt("እባክዎ ኢሜይልዎን ያስገቡ:", "example@gmail.com");
            if (!email) return;

            const firstName = prompt("የእርስዎን ስም ያስገቡ:", "ብርሃኑ");
            if (!firstName) return;

            const lastName = prompt("የአባትዎን ስም ያስገቡ:", "ቢያድጌ");
            if (!lastName) return;

            try {
                const { data: order, error } = await client
                    .from('orders')
                    .insert([{ total_amount: totalAmount, status: 'pending', payment_method: 'chapa' }])
                    .select()
                    .single();

                if (error) {
                    alert('ትዕዛዝ ማስመዝገብ አልተቻለም፡ ' + error.message);
                    return;
                }

                const CHAPA_PUBLIC_KEY = 'CHAPA_TEST_PUB_lySnQ7s0rqESvfkJyNtF-iHtrlK0A0RrkWaQKN7I'; 
                const txRef = 'tx-' + Math.random().toString(36).substring(2, 15);

                const form = document.createElement('form');
                form.method = 'POST';
                form.action = 'https://api.chapa.co/v1/hosted/pay';

                const fields = {
                    public_key: CHAPA_PUBLIC_KEY,
                    amount: totalAmount,
                    currency: 'ETB',
                    email: email,
                    first_name: firstName,
                    last_name: lastName,
                    tx_ref: txRef,
                    callback_url: 'https://webhook.site/your-callback',
                    return_url: window.location.href
                };

                for (const key in fields) {
                    const hiddenField = document.createElement('input');
                    hiddenField.type = 'hidden';
                    hiddenField.name = key;
                    hiddenField.value = fields[key];
                    form.appendChild(hiddenField);
                }

                document.body.appendChild(form);
                form.submit();

            } catch (err) {
                console.error('Checkout Error:', err);
                alert('ስህተት ተፈጥሯል፡ ' + err.message);
            }
        }

        fetchBooks();
    </script>
</body>
</html>
